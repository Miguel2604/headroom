<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coding quota menu bar item states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fragment+Mono&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.7}
::selection{background:#fff;color:#000}
.extra{display:flex;align-items:center;gap:6px;height:24px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:inherit;font-family:'Fragment Mono',ui-monospace,monospace;font-size:12px;font-weight:500;cursor:default}
.extra:focus-visible{outline:2px solid currentColor;outline-offset:1px}
.glyph{display:grid;grid-template-columns:repeat(5,2.4px);gap:1.4px 1px}
.g{width:2.4px;height:2.4px;border-radius:50%;background:currentColor}
.g-off{opacity:.3}
</style>
</helmet>
<div style="width: 900px; height: 296px; box-sizing: border-box; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; background: {{t.ground}}; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 13px; -webkit-font-smoothing: antialiased">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="4">
  <div style="position: relative; overflow: hidden; height: 32px; border-radius: 10px; color: {{t.ink}}">
    <img src="{{t.photo}}" alt="" style="position: absolute; left: 0; top: 0; width: 100%; height: 520px; object-fit: cover; object-position: 50% 0; filter: grayscale(1) contrast(1.08)">
    <div style="position: relative; height: 32px; display: flex; align-items: center; gap: 20px; padding: 0 16px">
      <span style="font-weight: 700">Terminal</span>
      <span>Shell</span><span>Edit</span><span>View</span>
      <div style="flex-grow: 1"></div>
      <button class="extra" aria-label="{{b.aria}}">
        <span class="glyph" aria-hidden="true"><sc-for list="{{b.glyph}}" as="g" hint-placeholder-count="10"><span class="g g-{{g.s}}"></span></sc-for></span>
        <sc-if value="{{b.text}}" hint-placeholder-val="{{ true }}"><span>{{b.text}}</span></sc-if>
      </button>
      <svg width="17" height="13" viewBox="0 0 17 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M1.5 4.5a10 10 0 0 1 14 0"></path><path d="M4 7.2a6.4 6.4 0 0 1 9 0"></path><path d="M6.6 9.9a2.8 2.8 0 0 1 3.8 0"></path></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" aria-hidden="true"><rect x="0.75" y="0.75" width="21.5" height="11.5" rx="3.2" fill="none" stroke="currentColor" stroke-opacity="0.45" stroke-width="1.2"></rect><rect x="2.5" y="2.5" width="14" height="8" rx="1.8" fill="currentColor"></rect><path d="M23.6 4.5v4a2 2 0 0 0 0-4z" fill="currentColor" fill-opacity="0.45"></path></svg>
      <span style="font-weight: 500">Wed 4 Nov  9:41</span>
    </div>
  </div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":900,"height":296}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark ?? true;
    var t = dark
      ? { ground: '#141414', photo: '/_blob/ae78eca847af583cb29cc01e5847a98a', ink: 'rgba(255, 255, 255, 0.94)' }
      : { ground: '#E4E4E4', photo: '/_blob/bd48283a55fc4c5df468cfecc3f57707', ink: 'rgba(0, 0, 0, 0.86)' };
    // Top row of five dots = Claude Code left, bottom row = Codex left. Monochrome, like every menu bar extra.
    function glyph(claude, codex) {
      var out = [], a = Math.round(claude / 20), b = Math.round(codex / 20);
      for (var i = 0; i < 5; i++) out.push({ s: i < a ? 'on' : 'off' });
      for (var j = 0; j < 5; j++) out.push({ s: j < b ? 'on' : 'off' });
      return out;
    }
    // Sample states, top to bottom: icon only, tightest limit, running out, limit reached.
    var bars = [
      { glyph: glyph(38, 77), text: '', aria: 'Coding quotas: Claude Code 38 percent left, Codex 77 percent left' },
      { glyph: glyph(38, 77), text: '38%', aria: 'Coding quotas: tightest limit 38 percent left' },
      { glyph: glyph(38, 77), text: 'OUT ~11:13', aria: 'Coding quotas: Claude Code runs out around 11:13' },
      { glyph: glyph(0, 77), text: 'BACK 12:12', aria: 'Coding quotas: Claude Code limit reached, back at 12:12' }
    ];
    return { t: t, bars: bars };
  }
}
</script>
</body>
</html>
