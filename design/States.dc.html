<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Small quota widget states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&amp;family=Fragment+Mono&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.7}
::selection{background:#fff;color:#000}
.num{font-family:'Doto',ui-monospace,monospace;font-weight:900;letter-spacing:0}
.lbl{font-family:'Fragment Mono',ui-monospace,monospace;font-size:11px;line-height:14px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.dots{display:flex;justify-content:space-between;align-items:center}
.d{border-radius:50%;flex-shrink:0;box-sizing:border-box}
.d-on{background:currentColor}
.d-off{background:currentColor;opacity:.22}
.d-pace{box-shadow:inset 0 0 0 1.5px currentColor}
.retry{padding:2px 7px;border:0;border-radius:999px;background:transparent;box-shadow:inset 0 0 0 1px currentColor;color:inherit;cursor:default}
.retry:hover{background:#fff;color:#000}
.retry:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</helmet>
<div style="width: 1042px; height: 266px; position: relative; overflow: hidden; background: #3A3A3A; color: #fff; font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased">
<img src="/_blob/ae78eca847af583cb29cc01e5847a98a" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 45%; filter: grayscale(1) contrast(1.08)">
<div style="position: relative; box-sizing: border-box; height: 100%; padding: 48px; display: flex; gap: 24px">
<sc-for list="{{cards}}" as="s" hint-placeholder-count="5">
  <section aria-label="{{s.state}}: {{s.aria}}" style="width: 170px; height: 170px; flex-shrink: 0; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; border-radius: 24px; background: {{t.bg}}; backdrop-filter: {{t.blur}}; -webkit-backdrop-filter: {{t.blur}}; box-shadow: {{t.edge}}; filter: {{t.filter}}">
    <span class="lbl" style="opacity: 0.68">{{s.title}}</span>
    <div style="flex-grow: 1"></div>
    <span class="num" style="font-size: {{s.bigSize}}px; line-height: 50px; opacity: {{s.dim}}">{{s.big}}</span>
    <div class="dots" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{s.left}}" aria-label="{{s.aria}}" style="margin-top: 12px; opacity: {{s.dim}}">
      <sc-for list="{{s.dots}}" as="d" hint-placeholder-count="14"><span class="d d-{{d.s}}" style="width: 7px; height: 7px"></span></sc-for>
    </div>
    <div style="margin-top: 12px; height: 18px; display: flex; align-items: center; justify-content: space-between">
      <sc-if value="{{s.pill}}" hint-placeholder-val="{{ false }}"><span class="lbl" style="padding: 2px 7px; border-radius: 999px; background: #fff; color: #000">{{s.note}}</span></sc-if>
      <sc-if value="{{s.plain}}" hint-placeholder-val="{{ true }}"><span class="lbl" style="opacity: {{s.noteOpacity}}">{{s.note}}</span></sc-if>
      <sc-if value="{{s.retry}}" hint-placeholder-val="{{ false }}"><button class="lbl retry">Retry</button></sc-if>
    </div>
  </section>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"material":{"editor":"enum","options":["tinted","clear"],"default":"tinted"},"$preview":{"width":1042,"height":266}}'>
class Component extends DCLogic {
  renderVals() {
    var clear = (this.props.material ?? 'tinted') === 'clear';
    var t = clear
      ? { bg: 'transparent', blur: 'none', edge: 'none', filter: 'drop-shadow(0 1px 8px rgba(0, 0, 0, 0.55))' }
      : { bg: 'rgba(12, 12, 12, 0.46)', blur: 'blur(28px)', edge: 'inset 0 0 0 1px rgba(255, 255, 255, 0.1)', filter: 'none' };
    function dots(left, pace, n) {
      var on = Math.round(left / 100 * n), p = Math.max(1, Math.round(pace / 100 * n)), out = [];
      for (var i = 0; i < n; i++) out.push({ s: i === p - 1 ? 'pace' : (i < on ? 'on' : 'off') });
      return out;
    }
    // Sample states, left to right: on pace, running out, limit reached, unused quota about to reset, couldn't update.
    var cards = [
      { state: 'On pace', title: 'Codex · 5h', big: '77%', left: 77, pace: 64, note: 'Resets 12:53' },
      { state: 'Running out', title: 'Claude · 5h', big: '38%', left: 38, pace: 50, note: 'Out ~11:13', pill: true },
      { state: 'Limit reached', title: 'Claude · back at', big: '12:12', bigSize: 42, left: 0, pace: 22, note: 'Limit reached', pill: true },
      { state: 'Unused, resetting soon', title: 'Codex · week', big: '43%', left: 43, pace: 3, note: 'Expires in 4h 39m', noteOpacity: 1 },
      { state: 'Could not update', title: 'Codex · 5h', big: '77%', left: 77, pace: 64, note: 'As of 9:12', dim: 0.4, retry: true }
    ].map(function (c) {
      return Object.assign({ bigSize: 50, dim: 1, noteOpacity: 0.68, pill: false, retry: false }, c, {
        plain: !c.pill,
        dots: dots(c.left, c.pace, 14),
        aria: c.title + ', ' + c.left + '% left, ' + c.note
      });
    });
    return { t: t, cards: cards };
  }
}
</script>
</body>
</html>
